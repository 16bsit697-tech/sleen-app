<!DOCTYPE html>
<html>
<head>
    <title>Register - Sleen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            padding: 50px 0;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
        }
        .disclaimer {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }
        hr {
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-card">
            <div class="text-center mb-4">
                <i class="fas fa-bullhorn fa-3x" style="color: #667eea;"></i>
                <h2 class="mt-2">Create Account</h2>
                <p class="text-muted">Join Sleen to connect with customers</p>
            </div>
            
            <form method="POST">
                <h5 class="mb-3">Account Information</h5>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <input type="password" name="password" class="form-control" placeholder="Password" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <input type="text" name="first_name" class="form-control" placeholder="First Name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <input type="text" name="last_name" class="form-control" placeholder="Last Name" required>
                    </div>
                </div>
                <div class="mb-3">
                    <input type="text" name="business_name" class="form-control" placeholder="Business Name" required>
                </div>
                <div class="mb-3">
                    <textarea name="business_address" class="form-control" rows="2" placeholder="Business Address" required></textarea>
                </div>
                
                <hr>
                
                <h5 class="mb-3">Card Information</h5>
                <div class="mb-3">
                    <input type="text" name="card_holder" class="form-control" placeholder="Name on Card">
                </div>
                <div class="mb-3">
                    <input type="text" name="card_number" class="form-control" placeholder="Card Number">
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <input type="text" name="cvv" class="form-control" placeholder="CVV">
                    </div>
                    <div class="col-md-4 mb-3">
                        <input type="text" name="expiration" class="form-control" placeholder="MM/YY">
                    </div>
                    <div class="col-md-4 mb-3">
                        <input type="text" name="zip_code" class="form-control" placeholder="Zip Code">
                    </div>
                </div>
                
                <div class="disclaimer mb-4">
                    <i class="fas fa-info-circle"></i> 
                    Service is free, tip jar is optional. 
                    Card information can be removed after account creation.
                </div>
                
                <button type="submit" class="btn-register">Create Account</button>
            </form>
            
            <hr>
            <p class="text-center mb-0">Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>
</body>
</html>
